#
# The QEMU suites on GitHub-hosted runners. One job builds the release
# image, the test image and the QS/400 guest image the partition suites
# IPL, and runs the installation ISO to its first screen; then a job
# for each shard of .github/qemu-shards.txt takes those images and runs
# its suites, the shards side by side. A shard's suites run one at a
# time: they are sensitive to load. The fuzz targets are ci.yml's.
#
# By hand, for any branch: `gh workflow run qemu.yml --ref BRANCH`, or
# with `-f suites="partition-three partition-tools"` for those alone,
# on one runner.

name: qemu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites to run, separated by spaces (empty: every one, in shards)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: qemu-${{ github.ref }}-${{ inputs.suites }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  images:
    name: build the images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qsvs-host
        with:
          images: "true"
      - run: cargo run -q -p build -- doctor

      # The shards, as a matrix; or the suites named, as one shard.
      # Every suite is in exactly one shard.
      - name: The shards
        id: shards
        env:
          NAMED: ${{ inputs.suites }}
        run: |
          lines=$(grep -v '^#' .github/qemu-shards.txt | grep .)
          want=$(cargo run -q -p build -- test --suite list | grep -vx fuzz | sort)
          have=$(echo "$lines" | cut -d: -f2 | tr ' ' '\n' | grep . | sort)
          if [ "$want" != "$have" ]; then
            echo "::error::.github/qemu-shards.txt and the suites differ (< a suite in no shard, > a shard's suite that is no suite, or twice):"
            diff <(echo "$want") <(echo "$have") || true
            exit 1
          fi
          if [ -n "$NAMED" ]; then
            lines="named: $NAMED"
          fi
          shards=$(echo "$lines" | jq -R -s -c 'split("\n") | map(select(length > 0) | split(": ") | {shard: .[0], suites: .[1]})')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "$shards"

      # The guest of the partition suites that IPL QS/400: its disk
      # image, built by QS/400's own orchestrator at the commit every
      # QS/400 crate here is pinned to (docs/PHASE4.md), and kept by that
      # commit: it changes only when the pin does.
      - name: The QS/400 pin
        id: pin
        run: |
          rev=$(sed -n 's/^buildkit = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: QS/400 guest image (cache)
        id: guest
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qs400-guest.img
          key: qs400-guest-${{ steps.pin.outputs.rev }}
      - name: QS/400 guest image (build)
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/quartzsystems/quartz-systems-400 "$RUNNER_TEMP/qs400"
          git -C "$RUNNER_TEMP/qs400" checkout -q "${{ steps.pin.outputs.rev }}"
          (cd "$RUNNER_TEMP/qs400" && QS400_TARGET_DIR="$RUNNER_TEMP/qs400-target" cargo run -q -p build -- all)
          cp --sparse=always "$(cat "$RUNNER_TEMP/qs400-target/images/disk.path")" "$RUNNER_TEMP/qs400-guest.img"
          rm -rf "$RUNNER_TEMP/qs400" "$RUNNER_TEMP/qs400-target"

      - run: cargo run -q -p build -- all
      - run: cargo run -q -p build -- all --test-image
      - run: cargo run -q -p build -- test --media iso

      # What the shards need: the images and the files that point at
      # them, at the paths they were built at, and the guest image.
      - name: Pack the images
        run: |
          files=$(for kind in target/images target/test-image/images; do
            ls "$kind"/*.path
            cat "$kind"/*.path | sed "s|^$PWD/||"
          done | sort -u)
          cp --sparse=always "$RUNNER_TEMP/qs400-guest.img" qs400-guest.img
          tar --sparse -cf - $files qs400-guest.img | zstd -T0 -3 -o "$RUNNER_TEMP/images.tar.zst"
          rm qs400-guest.img
          ls -lh "$RUNNER_TEMP/images.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: ${{ runner.temp }}/images.tar.zst
          compression-level: 0
          retention-days: 3

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-images
          path: |
            target/images/manifest.json
            target/test-image/images/manifest.json
            target/logs/
            target/test-image/logs/
          if-no-files-found: ignore

      # Only main keeps the caches the next runs start from.
      - name: Build cache (save, main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/src
            target/kernel
            target/x86_64-unknown-linux-musl
            target/debug
            target/test-image/src
            target/test-image/kernel
            target/test-image/x86_64-unknown-linux-musl
          key: qsvs-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'kernel/VERSION', 'kernel/config/**') }}-${{ github.run_id }}
      - name: Host tools cache (save, main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: qsvs-host-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}

  suites:
    name: suites ${{ matrix.shard }}
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qsvs-host
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: ${{ runner.temp }}
      - name: Unpack the images
        run: |
          zstd -dc "$RUNNER_TEMP/images.tar.zst" | tar --sparse -xf -
          mv qs400-guest.img "$RUNNER_TEMP/qs400-guest.img"
          echo "QSVS_QS400_IMAGE=$RUNNER_TEMP/qs400-guest.img" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/images.tar.zst"
          df -h /
      - name: The suites
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          set -o pipefail
          mkdir -p target/suite-logs
          failed=()
          for suite in $SUITES; do
            echo "::group::$suite"
            cargo run -q -p build -- test --suite "$suite" 2>&1 | tee "target/suite-logs/$suite.log" || failed+=("$suite")
            echo "::endgroup::"
            grep -a -E "PASS $suite|FAIL" "target/suite-logs/$suite.log" | cut -c1-300 || true
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.shard }}
          path: target/suite-logs/
          if-no-files-found: ignore
