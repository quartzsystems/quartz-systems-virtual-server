#
# The QEMU suites: build the release image and the test image, then run
# Phase 0's suite on the release image (slot A and slot B, and the
# installation ISO), the base system's ten on the test image, and the
# fourteen of the installer, the mirrored load source and Service Tools,
# which install from the test image's ISO onto blank disks.
#
# NEEDS-CODY: the suite boots a hypervisor, so the guest itself must see
# VMX or SVM. That takes a runner with /dev/kvm AND nested
# virtualization offered to its guests. The first step checks for both
# and fails with a message when either is missing; if GitHub's hosted
# runners do not pass it, this job needs a self-hosted runner (change
# `runs-on`), which is Cody's to provide (docs/OPEN_QUESTIONS.md, 6).

name: qemu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  qemu:
    name: build both images, test disk and iso
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: KVM for QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: KVM and nested virtualization on this runner
        run: |
          if ! [ -r /dev/kvm ] || ! [ -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not usable here: this job needs a self-hosted runner (NEEDS-CODY)"
            exit 1
          fi
          nested=$(cat /sys/module/kvm_intel/parameters/nested /sys/module/kvm_amd/parameters/nested 2>/dev/null | head -n1)
          case "$nested" in
            Y|y|1) echo "nested virtualization: $nested" ;;
            *)
              echo "::error::nested virtualization is off here (${nested:-no kvm module}): this job needs a self-hosted runner (NEEDS-CODY)"
              exit 1 ;;
          esac

      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make flex bison bc perl xz-utils gpg gzip tar git libelf-dev libssl-dev \
            qemu-system-x86 ovmf lsb-release wget software-properties-common gnupg
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y --no-install-recommends lld-21 llvm-21
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo-deny (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/src
            target/kernel
            target/x86_64-unknown-linux-musl
            target/debug
            target/test-image/src
            target/test-image/kernel
            target/test-image/x86_64-unknown-linux-musl
          key: qsvs-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'kernel/VERSION', 'kernel/config/**') }}

      # The guest of the partition suites that IPL QS/400: its disk
      # image, built by QS/400's own orchestrator at the commit every
      # QS/400 crate here is pinned to (docs/PHASE3.md).
      - name: QS/400 guest image at the pinned commit
        run: |
          pin=$(sed -n 's/^buildkit = .*rev = "([0-9a-f]*)".*//p' Cargo.toml)
          git clone https://github.com/quartzsystems/quartz-systems-400 "$RUNNER_TEMP/qs400"
          git -C "$RUNNER_TEMP/qs400" checkout "$pin"
          (cd "$RUNNER_TEMP/qs400" && QS400_TARGET_DIR="$RUNNER_TEMP/qs400-target" cargo run -q -p build -- all)
          echo "QSVS_QS400_IMAGE=$(cat "$RUNNER_TEMP/qs400-target/images/disk.path")" >> "$GITHUB_ENV"

      - run: cargo run -q -p build -- doctor
      - run: cargo run -q -p build -- all
      - run: cargo run -q -p build -- all --test-image
      - run: cargo run -q -p build -- test
      - run: cargo run -q -p build -- test --media iso

      - name: Images and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsvs-images
          path: |
            target/images/manifest.json
            target/images/manifest.sig
            target/test-image/images/manifest.json
            target/logs/
            target/test-image/logs/
          if-no-files-found: ignore
