#
# QS/VS CI: format, clippy with warnings denied, unit tests (the license
# header check and the neutrality check of base/ among them), build deny
# and build notices --check. Every
# job runs on GitHub's Ubuntu runners with the toolchain
# rust-toolchain.toml pins. The QEMU suite is qemu.yml.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host packages (clang links the host tools)
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The image's binaries are cfg(target_os = "linux") and built for musl.
      - run: cargo clippy -p qsvsinit -p qsvslogd -p qsvsnetd -p qsvsstgd -p qsvstools -p qsvsinstall -p qsvshook --all-targets --locked --target x86_64-unknown-linux-musl -- -D warnings
      # PID 1 and Service Tools as a test image has them: the code under
      # cfg(test_hooks).
      - run: cargo clippy -p qsvsinit -p qsvstools --locked --target x86_64-unknown-linux-musl -- -D warnings
        env:
          QSVS_TEST_HOOKS: "1"

  test:
    name: unit tests and the header check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host packages (clang links the host tools)
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo test --workspace --locked
      # The same check `build doctor` runs: every .rs file starts with
      # the license header.
      - name: License headers
        run: cargo test -p build --locked -- host::header
      # And the other: base/ names no product and depends on nothing of lic/.
      - name: base/ is product-neutral
        run: cargo test -p build --locked -- host::neutral

  deny:
    name: build deny, notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host packages (clang links the host tools)
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo-deny (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo run -q -p build -- deny
      - run: cargo run -q -p build -- notices --check
