#
# A GitHub-hosted Ubuntu runner made into a QS/VS build and test host:
# room on the disk, KVM for QEMU (with nested virtualization, which the
# suites need: the host in QEMU runs partitions), LLVM 21 for the
# kernel, QEMU and OVMF for the suites, the pinned Rust toolchain, and
# the build cache.

name: qsvs build host
description: Disk space, KVM, LLVM 21, QEMU, OVMF, the pinned toolchain and the build cache.

inputs:
  images:
    description: "true for a job that builds the images: it restores the kernel trees and the musl build too"
    default: "false"

runs:
  using: composite
  steps:
    - name: Room on the disk
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h /

    - name: KVM for QEMU
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: KVM and nested virtualization on this runner
      shell: bash
      run: |
        if ! [ -r /dev/kvm ] || ! [ -w /dev/kvm ]; then
          echo "::error::/dev/kvm is not usable here: this job needs a runner with KVM"
          exit 1
        fi
        nested=$(cat /sys/module/kvm_intel/parameters/nested /sys/module/kvm_amd/parameters/nested 2>/dev/null | head -n1)
        case "$nested" in
          Y|y|1) echo "nested virtualization: $nested; $(nproc) processors, $(free -g | awk '/Mem:/ {print $2}') GB" ;;
          *)
            echo "::error::nested virtualization is off here (${nested:-no kvm module})"
            exit 1 ;;
        esac

    - name: Packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          make flex bison bc perl xz-utils gpg gzip tar zstd git libelf-dev libssl-dev \
          qemu-system-x86 ovmf lsb-release wget software-properties-common gnupg
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        sudo bash /tmp/llvm.sh 21
        sudo apt-get install -y --no-install-recommends lld-21 llvm-21
        echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

    - name: Toolchain (rust-toolchain.toml)
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - name: cargo-deny (prebuilt)
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny

    # The kernel trees, the crates' downloads and the compiled
    # dependencies, from the newest run on main (only main saves them:
    # see the images job's last step).
    - name: Build cache (restore)
      if: inputs.images == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/src
          target/kernel
          target/x86_64-unknown-linux-musl
          target/debug
          target/test-image/src
          target/test-image/kernel
          target/test-image/x86_64-unknown-linux-musl
        key: qsvs-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'kernel/VERSION', 'kernel/config/**') }}-${{ github.run_id }}
        restore-keys: |
          qsvs-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'kernel/VERSION', 'kernel/config/**') }}-
          qsvs-build-

    # A job that only runs suites needs the host tools alone.
    - name: Host tools cache (restore)
      if: inputs.images != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/debug
        key: qsvs-host-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
        restore-keys: |
          qsvs-host-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
          qsvs-host-
