[package]
name = "fuzz"
description = "QS/VS's fuzzer, in Rust: every reader of bytes a guest controls, run on mutated input with LLVM's coverage counters as the guide"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "qsvsfuzz"
path = "src/main.rs"

[dependencies]
tape = { path = "../../stg/tape", version = "0.1.0" }
ipl = { path = "../../vmm/ipl", version = "0.1.0" }
devices = { path = "../../vmm/devices", version = "0.1.0" }
arch = { path = "../../vmm/arch", version = "0.1.0" }
# What a VMM reports, which a guest can put text into.
partd = { path = "../../part/partd", version = "0.1.0" }
refcode = { path = "../../lic/refcode", version = "0.1.0" }
# The QSI host server: what a console sends it.
qsiserver = { path = "../../qsi/server", version = "0.1.0" }
update = { path = "../../base/update", version = "0.1.0" }
qsvsupdd = { path = "../../lic/qsvsupdd", version = "0.1.0" }
# What comes from outside a guest: seed volumes and their answers, the
# labels on any disk, through the product's own names.
seed = { path = "../../base/seed", version = "0.1.0" }
install = { path = "../../base/install", version = "0.1.0" }
panels = { path = "../../base/panels", version = "0.1.0" }
pool = { path = "../../stg/pool", version = "0.1.0" }
loadsource = { path = "../../base/loadsource", version = "0.1.0" }
release = { path = "../../lic/release", version = "0.1.0" }
abrec.workspace = true
uuid.workspace = true
# The protocol's frames, for the channel target's seeds.
qsipart.workspace = true
vm-memory.workspace = true
virtio-queue.workspace = true
vmm-sys-util.workspace = true

[lints]
workspace = true
