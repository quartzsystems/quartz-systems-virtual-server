[package]
name = "qsiserver"
description = "The QSI host server: the only listener a QS/VS host has. Mutual TLS by QS/400's trust crate, its session, pairing, and every request of the host's families translated to the services that own the state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# QSI's messages, session and trust rules: QS/400's crates, pinned with
# the others. Nothing of them is restated here.
qsi.workspace = true
qsisess.workspace = true
qsitrust.workspace = true
state = { path = "../../base/state", version = "0.1.0" }
# The services a request is translated to: their sockets' types and
# clients.
partd = { path = "../../part/partd", version = "0.1.0" }
pio = { path = "../../part/pio", version = "0.1.0" }
model = { path = "../../part/model", version = "0.1.0" }
resource = { path = "../../part/resource", version = "0.1.0" }
poold = { path = "../../stg/poold", version = "0.1.0" }
vswitchd = { path = "../../net/vswitchd", version = "0.1.0" }
vswitch = { path = "../../net/vswitch", version = "0.1.0" }
qvsmsg = { path = "../../lic/qvsmsg", version = "0.1.0" }
supervise = { path = "../../base/supervise", version = "0.1.0" }
refcode = { path = "../../lic/refcode", version = "0.1.0" }
appliance = { path = "../../base/appliance", version = "0.1.0" }
logd = { path = "../../base/logd", version = "0.1.0" }
qsilocal = { path = "../local", version = "0.1.0" }
problem = { path = "../../base/problem", version = "0.1.0" }
hostdump = { path = "../../svc/hostdump", version = "0.1.0" }
update = { path = "../../svc/update", version = "0.1.0" }
ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true

[lints]
workspace = true
