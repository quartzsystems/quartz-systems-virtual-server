[package]
name = "partd"
description = "The partition manager: definitions and profiles in state, activation with resource accounting, the state machine of each partition, the VMM processes and their control groups, auto start, and the local socket it is driven over"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
model = { path = "../model", version = "0.1.0" }
# Physical I/O: what can be released and given.
pio = { path = "../pio", version = "0.1.0" }
resource = { path = "../resource", version = "0.1.0" }
qvsmsg = { path = "../../lic/qvsmsg", version = "0.1.0" }
refcode = { path = "../../lic/refcode", version = "0.1.0" }
state = { path = "../../base/state", version = "0.1.0" }
supervise = { path = "../../base/supervise", version = "0.1.0" }
# The configuration a VMM is started with, and what its exit codes mean.
qsvmm = { path = "../../vmm/qsvmm", version = "0.1.0" }
# The pool service: its socket's types, and the client of a running one.
poold = { path = "../../stg/poold", version = "0.1.0" }
fdpass = { path = "../../base/fdpass", version = "0.1.0" }
# The switch service: its socket's types, and the client of a running one.
vswitch = { path = "../../net/vswitch", version = "0.1.0" }
vswitchd = { path = "../../net/vswitchd", version = "0.1.0" }
ipc.workspace = true
# The service channel: QS/400's protocol crate, the channel's and the
# console's state, and the form of a dump.
qsipart.workspace = true
svcchan = { path = "../svcchan", version = "0.1.0" }
console-port = { path = "../console", version = "0.1.0" }
dump = { path = "../dump", version = "0.1.0" }
release = { path = "../../lic/release", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
# The host's PCI devices and IOMMU as they are now.
hostinv = { path = "../../lic/hostinv", version = "0.1.0" }
rustix.workspace = true
libc.workspace = true

[lints]
workspace = true
