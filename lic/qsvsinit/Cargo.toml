[package]
name = "qsvsinit"
description = "QS/VS PID 1: the IPL in order, the service table, the control socket, the status screen, the slot and the orderly shutdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
release = { path = "../release", version = "0.1.0" }
refcode = { path = "../refcode", version = "0.1.0" }
hostinv = { path = "../hostinv", version = "0.1.0" }
appliance = { path = "../../base/appliance", version = "0.1.0" }
state = { path = "../../base/state", version = "0.1.0" }
supervise = { path = "../../base/supervise", version = "0.1.0" }
logd = { path = "../../base/logd", version = "0.1.0" }
seed = { path = "../../base/seed", version = "0.1.0" }
identity = { path = "../../base/identity", version = "0.1.0" }
loadsource = { path = "../../base/loadsource", version = "0.1.0" }
stgd = { path = "../../base/stgd", version = "0.1.0" }
abrec.workspace = true
diskimg.workspace = true

# PID 1 is a Linux program; other hosts build a stub so the workspace checks.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
kvm-ioctls = "0.25.1"
kvm-bindings = "0.14.2"

[lints]
workspace = true
