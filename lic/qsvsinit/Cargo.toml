[package]
name = "qsvsinit"
description = "QS/VS PID 1: the IPL in order, the service table, the control socket, the status screen, the slot and the orderly shutdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
release = { path = "../release", version = "0.1.0" }
refcode = { path = "../refcode", version = "0.1.0" }
qsilocal = { path = "../../qsi/local", version = "0.1.0" }
problem = { path = "../../base/problem", version = "0.1.0" }
hostinv = { path = "../hostinv", version = "0.1.0" }
# Physical I/O: the released devices bound at the IPL.
pio = { path = "../../part/pio", version = "0.1.0" }
appliance = { path = "../../base/appliance", version = "0.1.0" }
state = { path = "../../base/state", version = "0.1.0" }
supervise = { path = "../../base/supervise", version = "0.1.0" }
logd = { path = "../../base/logd", version = "0.1.0" }
seed = { path = "../../base/seed", version = "0.1.0" }
identity = { path = "../../base/identity", version = "0.1.0" }
loadsource = { path = "../../base/loadsource", version = "0.1.0" }
stgd = { path = "../../base/stgd", version = "0.1.0" }
model = { path = "../../part/model", version = "0.1.0" }
resource = { path = "../../part/resource", version = "0.1.0" }
partd = { path = "../../part/partd", version = "0.1.0" }
vswitchd = { path = "../../net/vswitchd", version = "0.1.0" }
poold = { path = "../../stg/poold", version = "0.1.0" }
hostdump = { path = "../../svc/hostdump", version = "0.1.0" }
update = { path = "../../svc/update", version = "0.1.0" }
abrec.workspace = true
diskimg.workspace = true

# PID 1 is a Linux program; other hosts build a stub so the workspace checks.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
# The test hooks' probe of a passed tape drive (SG_IO).
libc.workspace = true
kvm-ioctls = "0.25.1"
kvm-bindings = "0.14.2"

[lints]
workspace = true
