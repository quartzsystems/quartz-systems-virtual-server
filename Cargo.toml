[workspace]
resolver = "3"
members = [
    # Host tools: the build orchestrator and the conformance harness.
    "tools/build",
    "tools/conformance",
    # Licensed Internal Code: PID 1, release identity, reference codes, the services.
    "lic/qsvsinit",
    "lic/qsvslogd",
    "lic/qsvsnetd",
    "lic/qsvsstgd",
    "lic/qsvsinstall",
    # The test hooks: built into a test image only.
    "lic/qsvshook",
    "lic/release",
    "lic/refcode",
    "lic/hostinv",
    # Service Tools: QS/VS's menu and its host-specific panels.
    "svc/tools",
    # Base: what every Quartz appliance needs, product-neutral. QS/MC pins
    # these from this repository.
    "base/appliance",
    "base/state",
    "base/supervise",
    "base/logd",
    "base/seed",
    "base/netd",
    "base/identity",
    "base/users",
    "base/panels",
    "base/install",
    "base/loadsource",
    "base/stgd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# QS/400's crates: git dependencies, every one at the same commit
# (docs/PHASE0.md records it). Never path dependencies, never copies.
buildkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
vrm = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
diskimg = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
abrec = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
ipc = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
netlink = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
dhcp = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
ntp = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
blockdev = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
protect = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
ublk = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
console = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff", default-features = false }
scrkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }
svcusers = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "03d6492913318da96bc707cb68d3b54a94ef9bff" }

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
uuid = "1.28.0"
libc = "0.2.190"
rustix = { version = "1.1.6", features = ["fs", "mount", "event", "process", "system", "time", "pipe", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Shared by the image binaries and the host tools. The userland check
# wants the image's binaries static and stripped.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
