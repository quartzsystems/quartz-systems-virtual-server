[workspace]
resolver = "3"
members = [
    # Host tools: the build orchestrator and the conformance harness.
    "tools/build",
    "tools/conformance",
    # Licensed Internal Code: PID 1, release identity, reference codes, the disk.
    "lic/qsvsinit",
    "lic/release",
    "lic/refcode",
    "lic/hostdisk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# QS/400's crates: git dependencies, every one at the same commit
# (docs/PHASE0.md records it). Never path dependencies, never copies.
buildkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "6d5532fa80e4328d57b410d4bf19e64baf4a40f6" }
vrm = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "6d5532fa80e4328d57b410d4bf19e64baf4a40f6" }
diskimg = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "6d5532fa80e4328d57b410d4bf19e64baf4a40f6" }
abrec = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "6d5532fa80e4328d57b410d4bf19e64baf4a40f6" }

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
uuid = "1.28.0"
libc = "0.2.190"
rustix = { version = "1.1.6", features = ["fs", "mount"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Shared by the image binaries and the host tools. The userland check
# wants the image's binaries static and stripped.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
