[workspace]
resolver = "3"
members = [
    # Host tools: the build orchestrator and the conformance harness.
    "tools/build",
    "tools/conformance",
    # The fuzzer: every reader of bytes a guest controls.
    "tools/fuzz",
    "tools/qsictl",
    # Licensed Internal Code: PID 1, release identity, reference codes, the services.
    "lic/qsvsinit",
    "lic/qsvslogd",
    "lic/qsvsnetd",
    "lic/qsvsstgd",
    "lic/qsvspartd",
    "lic/qsvspoold",
    "lic/qsvsqsid",
    "lic/qsvsvswitchd",
    "lic/qsvsprobd",
    "lic/qsvsupdd",
    "lic/qsvsinstall",
    # The test hooks: built into a test image only.
    "lic/qsvshook",
    "lic/release",
    "lic/refcode",
    "lic/hostinv",
    # The message catalogue: QVS messages.
    "lic/qvsmsg",
    # Service Tools: QS/VS's menu and its host-specific panels.
    "svc/tools",
    # Service: the problem log.
    "svc/problem",
    "svc/hostdump",
    "svc/update",
    "qsi/local",
    "qsi/server",
    # Base: what every Quartz appliance needs, product-neutral. QS/MC pins
    # these from this repository.
    "base/appliance",
    "base/state",
    "base/supervise",
    "base/logd",
    "base/seed",
    "base/netd",
    "base/identity",
    "base/users",
    "base/panels",
    "base/install",
    "base/loadsource",
    "base/stgd",
    "base/fdpass",
    "base/stream",
    "base/processor",
    # The VMM: one process for one partition.
    "vmm/arch",
    "vmm/acpi",
    "vmm/devices",
    "vmm/ipl",
    "vmm/qsvmm",
    # The partition manager: the model, the resources, the service.
    "part/model",
    "part/resource",
    "part/pio",
    "part/partd",
    # The service channel, the console and dumps (Phase 7).
    "part/dump",
    "part/svcchan",
    "part/console",
    # Storage: pools, virtual disks, the media library, tape volumes.
    "stg/pool",
    "stg/vdisk",
    "stg/media",
    "stg/poold",
    "stg/tape",
    # Virtual Ethernet: the netlink pieces, the switches, their service.
    "net/nl",
    "net/vswitch",
    "net/vswitchd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# QS/400's crates: git dependencies, every one at the same commit
# (docs/PHASE0.md records it). Never path dependencies, never copies.
buildkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
vrm = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
diskimg = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
abrec = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
ipc = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
netlink = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
dhcp = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
ntp = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
blockdev = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
protect = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
ublk = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
console = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99", default-features = false }
scrkit = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
svcusers = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
# The guest's LIC record. The one QS/400-specific crate QS/VS depends on,
# and only the IPL loader (vmm/ipl) uses it.
licpart = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
# The partition service channel's protocol (QS/400's docs/QSID.md): the
# frames, the messages, the console as cells. The partition manager
# alone speaks it; qsvmm carries its bytes.
qsipart = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
# QSI: the messages and families, the session, and the trust rules
# (QS/400's docs/QSI.md). The QSI host server alone speaks them.
qsi = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
qsisess = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
qsitrust = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
# Secure Boot: the UKIs signed (Authenticode) by `build release` with the
# db key, and the pair made by `build keys`; the build tool alone.
pesign = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }
certs = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "423c65dea0b8c9fab3d2c3efaba6e9f27e679c99" }

# The rust-vmm crates the VMM is built on (docs/PHASE3.md says why each
# passes deny).
kvm-bindings = { version = "0.14.2", features = ["fam-wrappers"] }
kvm-ioctls = "0.25.1"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
virtio-queue = "0.18.0"
linux-loader = { version = "0.14.0", default-features = false, features = ["bzimage"] }
vm-superio = "0.8.2"
vmm-sys-util = "0.15.0"
acpi_tables = "0.2.1"
# VFIO's structures for physical I/O (docs/PHASE10.md says why the calls
# are the VMM's own and not vfio-ioctls').
vfio-bindings = "0.7.0"

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
uuid = "1.28.0"
libc = "0.2.190"
rustix = { version = "1.1.6", features = ["fs", "mount", "event", "process", "system", "time", "pipe", "termios", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# TLS for the QSI host server, as QS/400's trust crate has it: no
# default features, so no C and no other cryptography.
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
toml = "1.1.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Shared by the image binaries and the host tools. The userland check
# wants the image's binaries static and stripped.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

# The fuzzer (`build fuzz`): optimized, but a panic unwinds so the loop
# catches it, and arithmetic is checked as in tests.
[profile.fuzz]
inherits = "release"
panic = "unwind"
lto = false
opt-level = 2
debug-assertions = true
overflow-checks = true
strip = "none"
